# ─────────────────────────────────────────────────────────────────────────────
# Do not touch these settings once they are frozen.
# Any change alters the bytecode -> alters the CREATE2 addresses -> invalidates
# every mined vanity salt.
# bytecode_hash/cbor_metadata are off so that the trailing metadata is dropped
# and addresses depend only on real logic: editing comments, moving directories
# or switching machines will not affect reproducibility.
# ─────────────────────────────────────────────────────────────────────────────
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"

solc = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false

fs_permissions = [{ access = "read-write", path = "./deployments" }]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
base_sepolia = { key = "${ETHERSCAN_API_KEY}" }
base = { key = "${ETHERSCAN_API_KEY}" }
mainnet = { key = "${ETHERSCAN_API_KEY}" }
